[project]
name = "api-refactor"
version = "0.1.0"
description = "AI OpenAPI Refactoring & Validation Engine — local-first (Ollama), deterministic validation, critic + correction loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "openapi-spec-validator==0.9.0",
    "prance==26.7.19.0",
    "ollama==0.6.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
server = ["uvicorn==0.53.0"]

[project.scripts]
api-refactor = "app.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "needs_node: uses the Node CLIs (Spectral, swagger2openapi); skipped with an explicit reason when they are missing",
    "requires_ollama: end-to-end test against a real local Ollama with the configured models (skipped when Ollama is not reachable)",
]
addopts = "-m 'not requires_ollama'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
