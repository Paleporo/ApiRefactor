# Configurazione unica della pipeline. I flag CLI (--max-iterations, --verbose, ...)
# sovrascrivono questi valori solo per la singola run.

targetOpenApiVersion: "3.0"        # "3.0" | "3.1"
maxIterations: 3                   # iterazioni massime del feedback loop

refactorModel: "qwen3-coder:30b"   # Refactor Agent + Correction Engine + Rule Interpreter
criticModel: "deepseek-r1:14b"     # Critic Agent (ruolo separato)
criticThink: false                 # ragionamento esteso del Critic (solo modelli con capability "thinking"):
                                   # false lo disattiva esplicitamente -> chiamate molto più rapide su CPU
ollamaHost: "http://localhost:11434"

llmCallTimeoutSeconds: 600         # timeout singola chiamata LLM (CPU-only: generoso)
llmTechnicalRetries: 2             # retry tecnici per chiamata (timeout / output non conforme allo schema)
runTimeoutSeconds: 7200            # budget complessivo della run -> NEEDS_REVIEW se superato
llmTemperature: 0.0
llmContextTokenBudget: 12000       # budget indicativo per chiamata (8-16K)

logLevel: "INFO"                   # DEBUG mostra i frammenti inviati all'LLM e le risposte

rulesDir: "rules"
outputDir: "output"
compiledRulesCacheDir: ".cache/compiled-rules"

# Tool Node esterni: cercati nel PATH, poi in ./node_modules/.bin
spectralCommand: "spectral"
swagger2openapiCommand: "swagger2openapi"
externalToolTimeoutSeconds: 120
